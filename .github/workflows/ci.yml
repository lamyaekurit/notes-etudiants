#Pipeline d'intégration continue de l'application des notes
name: CI

# Quand le pipeline se lance
on:
  # à chaque modification envoyée sur la branche principale
  push:
    branches: [main]
  pull_request:

  # à la demande, depuis l'onglet Actions
  workflow_dispatch:

jobs:
  # Contrôle de chaque modification avant qu'elle n'entre dans main
  tests:
    runs-on: ubuntu-latest # une machine Linux fournie par GitHub
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest flake8 bandit

      # Le code respecte les règles d'écriture de l'équipe
      - name: Vérifier le style
        run: flake8 --max-line-length=100 *.py

      # Le code ne contient pas de faille connue (secret, injection…)
      - name: Analyser la sécurité du code
        run: bandit app.py auth.py
      # L'application rend le service attendu et respecte les exigences de sécurité
      - name: Lancer les tests
        run: pytest -v


  # Livraison : publier l'image de l'application
  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Le registre exige un nom d'image en minuscules
      - name: Nom de l'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Connexion au registre d'images de GitHub
      - name: Connexion au registre GitHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Une étiquette « dernière version » et une étiquette par commit
      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}